name: 📱 App iPhone — WordPress Sync

on:
  # ── Déclencheur principal : webhook WordPress via wp-sync.yml du site cuisine ─
  repository_dispatch:
    types:
      - wp_recipe_published
      - wp_recipe_updated
      - wp_recipe_deleted
      - wp_full_sync

  # ── Déclenchement manuel — TEST / DEBUG ─────────────────────────────────────
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode (full | recent)"
        required: false
        default: "recent"
      delete_id:
        description: "ID WordPress du post à supprimer"
        required: false
        default: ""

concurrency:
  group: iphone-wp-sync
  cancel-in-progress: false

jobs:
  sync:
    name: "WordPress → mockData.ts (App iPhone)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: ⚙️ Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: 📦 Install dependencies
        run: npm install --no-audit --no-fund

      # ── Résolution du mode ──────────────────────────────────────────────────
      - name: 🧭 Resolve sync mode
        id: mode
        run: |
          MODE="${{ github.event.inputs.mode || 'recent' }}"
          DELETE_ID="${{ github.event.inputs.delete_id || github.event.client_payload.delete_id || '' }}"
          EVENT="${{ github.event_name }}"
          ACTION="${{ github.event.action || '' }}"

          if [ "$EVENT" = "repository_dispatch" ]; then
            if [ "$ACTION" = "wp_full_sync" ]; then
              MODE="full"
            fi
          fi

          echo "mode=$MODE"         >> $GITHUB_OUTPUT
          echo "delete_id=$DELETE_ID" >> $GITHUB_OUTPUT
          echo "event=$EVENT"       >> $GITHUB_OUTPUT
          echo "⚡ Mode: $MODE | Event: $EVENT | DeleteID: $DELETE_ID"

      # ── Synchronisation WordPress → mockData.ts ─────────────────────────────
      - name: 🔄 Sync WordPress → mockData.ts
        run: |
          DELETE_FLAG=""
          if [ -n "${{ steps.mode.outputs.delete_id }}" ]; then
            DELETE_FLAG="--delete-id=${{ steps.mode.outputs.delete_id }}"
          fi
          node sync-recipes.js $DELETE_FLAG
        env:
          WP_PUBLIC_IP: ${{ secrets.WP_PUBLIC_IP }}
          WP_FORCE_PUBLIC: "true"
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      # ── Commit & Push → Vercel redéploie ────────────────────────────────────
      - name: 💾 Commit & Push → Vercel
        run: |
          git config user.name "WP-Sync Bot (iPhone)"
          git config user.email "m4nu.r0ssi@gmail.com"

          git add src/data/mockData.ts src/data/sync-stats.json 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "✅ Aucun changement, arrêt propre."
            exit 0
          fi

          ACTION="${{ github.event.action || github.event.inputs.mode || 'webhook' }}"
          POST_TITLE=$(echo "${{ github.event.client_payload.post_title || '' }}" | tr -d '"')

          if [ -n "$POST_TITLE" ]; then
            COMMIT_MSG="🍳 iPhone Sync: $POST_TITLE"
          else
            COMMIT_MSG="🔄 iPhone Sync: $ACTION - $(date -u '+%Y-%m-%d %H:%M')"
          fi

          git commit -m "$COMMIT_MSG"
          git pull --rebase --autostash origin main
          git push origin main
          echo "✅ Push → Vercel iPhone redéploie automatiquement"
