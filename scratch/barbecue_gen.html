<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: #FF416C; }
  svg { width: 800px; height: 800px; }
</style>
</head>
<body>
<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF416C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF4B2B;stop-opacity:1" />
    </linearGradient>
    <dropShadow id="shadow" dx="10" dy="10" stdDeviation="5" flood-opacity="0.3"/>
  </defs>
  <rect width="400" height="400" fill="url(#bgGrad)" rx="40" />
  <path d="M200 200 L400 400 L200 400 Z" fill="rgba(0,0,0,0.2)" />

  <!-- Grill -->
  <rect x="100" y="150" width="200" height="20" rx="5" fill="#333" filter="url(#shadow)" />
  <rect x="110" y="170" width="10" height="100" fill="#333" />
  <rect x="280" y="170" width="10" height="100" fill="#333" />
  
  <!-- Skewer -->
  <line x1="80" y1="140" x2="320" y2="140" stroke="#DDD" stroke-width="4" />
  <rect x="120" y="130" width="30" height="20" fill="#8B4513" rx="2" />
  <rect x="160" y="125" width="25" height="30" fill="#FF5252" rx="2" />
  <rect x="195" y="130" width="30" height="20" fill="#8B4513" rx="2" />
  <rect x="235" y="125" width="25" height="30" fill="#4CAF50" rx="2" />

  <!-- Fire -->
  <path d="M150 200 Q170 160 190 200 T230 200" fill="#FF9800" opacity="0.6" />
  <path d="M170 200 Q190 170 210 200" fill="#FF5722" opacity="0.8" />
</svg>
</body>
</html>
