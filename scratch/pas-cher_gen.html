<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: #0BA360; }
  svg { width: 800px; height: 800px; }
</style>
</head>
<body>
<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0BA360;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3CBA92;stop-opacity:1" />
    </linearGradient>
    <dropShadow id="shadow" dx="10" dy="10" stdDeviation="5" flood-opacity="0.2"/>
  </defs>
  <rect width="400" height="400" fill="url(#bgGrad)" rx="40" />
  <path d="M200 200 L400 400 L200 400 Z" fill="rgba(0,0,0,0.15)" />

  <!-- Piggy Bank -->
  <path d="M120 180 A60 60 0 1 1 280 180 Q280 240 200 240 Q120 240 120 180" fill="#F48FB1" filter="url(#shadow)" />
  <circle cx="280" cy="180" r="15" fill="#F06292" /> <!-- Nose -->
  <circle cx="160" cy="160" r="5" fill="#333" /> <!-- Eye -->
  <rect x="150" y="240" width="15" height="20" fill="#F06292" /> <!-- Leg 1 -->
  <rect x="235" y="240" width="15" height="20" fill="#F06292" /> <!-- Leg 2 -->
  
  <!-- Coins -->
  <circle cx="200" cy="100" r="15" fill="#FFD700" filter="url(#shadow)" />
  <text x="200" y="110" font-family="Arial" font-size="20" fill="#B8860B" text-anchor="middle" font-weight="bold">€</text>
  <circle cx="230" cy="120" r="12" fill="#FFA000" opacity="0.8" />
</svg>
</body>
</html>
