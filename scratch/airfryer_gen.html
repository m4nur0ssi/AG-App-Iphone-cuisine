<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: #43C6AC; }
  svg { width: 800px; height: 800px; }
</style>
</head>
<body>
<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#43C6AC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#191654;stop-opacity:1" />
    </linearGradient>
    <dropShadow id="shadow" dx="10" dy="10" stdDeviation="5" flood-opacity="0.3"/>
  </defs>
  <rect width="400" height="400" fill="url(#bgGrad)" rx="40" />
  <path d="M200 200 L400 400 L200 400 Z" fill="rgba(0,0,0,0.2)" />

  <!-- Airfryer Body -->
  <rect x="100" y="100" width="200" height="220" rx="40" fill="#333" filter="url(#shadow)" />
  <rect x="110" y="110" width="180" height="80" rx="10" fill="#111" />
  
  <!-- Digital Display -->
  <text x="200" y="160" font-family="monospace" font-size="30" fill="#00FF00" text-anchor="middle">180°C</text>
  
  <!-- Handle -->
  <rect x="180" y="220" width="40" height="60" rx="10" fill="#555" />
  
  <!-- Fries -->
  <g transform="translate(300, 300) rotate(15)">
    <rect x="-10" y="-30" width="8" height="40" fill="#FFD700" />
    <rect x="0" y="-25" width="8" height="40" fill="#FFC107" />
    <rect x="10" y="-35" width="8" height="40" fill="#FFD700" />
  </g>
</svg>
</body>
</html>
