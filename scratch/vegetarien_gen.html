<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: #00C853; }
  svg { width: 800px; height: 800px; }
</style>
</head>
<body>
<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00C853;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B2FF59;stop-opacity:1" />
    </linearGradient>
    <dropShadow id="shadow" dx="10" dy="10" stdDeviation="5" flood-opacity="0.2"/>
  </defs>
  <rect width="400" height="400" fill="url(#bgGrad)" rx="40" />
  <path d="M200 200 L400 400 L200 400 Z" fill="rgba(0,0,0,0.15)" />

  <!-- Carrot -->
  <g transform="translate(150, 150) rotate(-45)">
    <path d="M0 0 L100 0 L90 30 L0 0 Z" fill="#FF9800" filter="url(#shadow)" />
    <path d="M100 0 Q110 -10 120 0 Q110 10 100 0" fill="#4CAF50" />
  </g>

  <!-- Broccoli -->
  <g transform="translate(250, 250)">
    <rect x="-10" y="0" width="20" height="40" fill="#8B4513" filter="url(#shadow)" />
    <circle cx="0" cy="0" r="30" fill="#2E7D32" />
    <circle cx="-15" cy="-15" r="20" fill="#388E3C" />
    <circle cx="15" cy="-15" r="20" fill="#388E3C" />
  </g>

  <!-- Leaf -->
  <path d="M100 250 Q120 220 140 250 Q120 280 100 250" fill="#81C784" filter="url(#shadow)" />
</svg>
</body>
</html>
